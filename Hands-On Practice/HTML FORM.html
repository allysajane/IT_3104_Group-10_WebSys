<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Forms</title>
</head>
<body>
  <h1>HTML Forms</h1>

  <form action="#" method="post">

    <p>
      <label for="firstname">First Name:</label>
      <input type="text" id="firstname" name="firstname">
    </p>

    <p>
      <label for="lastname">Last Name:</label>
      <input type="text" id="lastname" name="lastname">
    </p>

    <p>
      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone">
    </p>

    <h4>Account:</h4>
    <p>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="juan@email.com"><br>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password">
    </p>

    <h4>Choose your character/s:</h4>
    <p>
      <input type="checkbox" id="allysa" name="characters" value="allysa">
      <label for="allysa">Allysa</label><br>

      <input type="checkbox" id="marc" name="characters" value="marc">
      <label for="marc">Marc</label><br>

      <input type="checkbox" id="glory" name="characters" value="glory">
      <label for="glory">Glory</label><br>

      <input type="checkbox" id="johnmark" name="characters" value="johnmark">
      <label for="johnmark">Johnmark</label>
    </p>

    <br>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

  </form>
</body>
</html>
